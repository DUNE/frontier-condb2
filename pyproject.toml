[project]
name = "frontier-condb2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mike Clymer", email = "mike.clymer@colostate.edu" }]
requires-python = ">=3.14"
dependencies = ["typer>=0.21.1"]

[project.scripts]
frontier-condb2 = "frontier_condb2.main:app"
