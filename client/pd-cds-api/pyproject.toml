[project]
name = "pd-cds-api"
version = "0.1.1"
description = "ProtoDUNE Conditions Data Service Client API Wrapper"
readme = "README.md"
authors = [{ name = "Mike Clymer", email = "mike.clymer@colostate.edu" }]
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13.5"]

[tool.uv.sources]
pd-cds-lib = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff>=0.14.10"]
test = []
