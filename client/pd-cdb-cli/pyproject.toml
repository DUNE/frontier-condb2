[project]
name = "pd-cdb-cli"
version = "0.1.1"
description = "ProtoDUNE Conditions Data Service CLI"
readme = "README.md"
authors = [{ name = "Mike Clymer", email = "mike.clymer@colostate.edu" }]
requires-python = ">=3.14"
dependencies = ["pd-cdb-lib", "typer>=0.21.1"]

[tool.uv.sources]
pd-cdb-lib = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff>=0.14.10"]
test = []
