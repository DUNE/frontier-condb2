name: Tag the release version on merges to the indicated branch.

on:
  push:
    branches:
      - main
      - 32-cicd-quadlet-artifact-release

jobs:
  read-and-tag-release-version:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Install git
        run: |
          dnf update -y
          dnf install git

      - name: Checkout repository
        uses: actions/checkout@v6
        # with:
        #   sparse-checkout: |
        #     VERSION

      - name: Read VERSION file
        id: release-version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Tag release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          git tag -a "${{ steps.release-version.outputs.version }}" \
            -m "Release ${{ steps.release-version.outputs.version }}"
          git push --tags
