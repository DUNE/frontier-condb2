name: Release

on:
  push:
    branches:
      # - main
      - 32-cicd-quadlet-artifact-release

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  read-and-tag-release-version:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Install git
        run: |
          dnf update -y
          dnf install git -y

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read VERSION file
        id: release-version
        run: echo "release_version=$(cat VERSION)" >> $GITHUB_ENV

      - name: Tag release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          git config --global --add safe.directory $PWD
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}"
          git tag -a "v$release_version" \
            -m "Release v$release_version"
          git push origin "v$release_version"

  build-and-upload-container-artifacts:
    needs: read-and-tag-release-version
    uses: ./.github/workflows/containers.yml
    secrets: inherit

  server-release:
    needs: build-and-upload-container-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Create server-dist directory
        run: mkdir -p server-dist

      - name: Download Quadlet artifacts
        uses: actions/download-artifact@v8
        with:
          name: quadlet-artifacts-${{ github.ref_name }}
          path: server-dist/
          skip-decompress: true

      - name: Create server release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v$release_version"
        run: |
          gh release create "$TAG" \
            ./server-dist/*.zip \
            --repo="$GITHUB_REPOSITORY" \
            --title="${TAG#v}" \
            --generate-notes
