name: Release

on:
  push:
    # branches:
    #   - main
    # tags:
    #   - "v*" # Trigger on tags like v0.1.0, v2.2.3, etc.

permissions:
  contents: write
  packages: write
  # attestations: write
  # id-token: write

env:
  REGISTRY: ghcr.io
  SERVICES: "condb2-rest-api frontier-server"

jobs:
  build-containers:
    uses: ./.github/workflows/containers-ci.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest

    steps:
    - name: Log in to GHCR
      shell: bash
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | \
          podman login ${{ env.REGISTRY }} \
          -u ${{ github.actor }} \
          --password-stdin

    - name: Tag and push images to GHCR
      shell: bash
      run: |
        for SERVICE in ${{ env.SERVICES }}; do
          IMAGE_NAME=`echo "${{ env.REGISTRY }}/${{ github.repository }}/${SERVICE}" | tr '[:upper:]' '[:lower:]'`
          echo "Tagging and pushing ${SERVICE} as ${IMAGE_NAME}"
          podman tag ${SERVICE} ${IMAGE_NAME}
          podman push ${IMAGE_NAME}
          podman rmi ${IMAGE_NAME}
        done
