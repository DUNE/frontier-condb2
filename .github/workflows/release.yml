name: Release

on:
  push:
    # branches:
    #   - main
    # tags:
    #   - "v*" # Trigger on tags like v0.1.0, v2.2.3, etc.

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-upload-container-artifacts:
    uses: ./.github/workflows/containers-ci.yml
    secrets: inherit

  server-release:
    needs: build-and-upload-container-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download Quadlet artifacts
        uses: actions/download-artifact@v8
        with:
          name: quadlet-artifacts

      - name: Create server release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag#v}" \
              --generate-notes
