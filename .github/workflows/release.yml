name: Release

on:
  push:
    branches:
      # - main
      - 32-cicd-quadlet-artifact-release

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  read-release-version:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release-version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            VERSION

      - name: Read VERSION file
        id: release-version
        run: echo "release_version=$(cat VERSION)" >> $GITHUB_OUTPUT

  build-and-upload-container-artifacts:
    needs: read-release-version
    uses: ./.github/workflows/server.yml
    with:
      release-version: "${{ needs.read-release-version.outputs.release-version }}"
    secrets: inherit

  server-release:
    needs:
      - read-release-version
      - build-and-upload-container-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Create server-dist directory
        run: mkdir -p server-dist

      - name: Download Quadlet artifacts
        uses: actions/download-artifact@v8
        with:
          name: "quadlet-artifacts-v${{ needs.read-release-version.outputs.release-version }}"
          path: server-dist/
          skip-decompress: true

      - name: Create server release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.read-release-version.outputs.release-version }}" \
            ./server-dist/*.zip \
            --repo="$GITHUB_REPOSITORY" \
            --title="v${{ needs.read-release-version.outputs.release-version }}" \
            --generate-notes

  tag-release-version:
    needs:
      - server-release
      - read-release-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Tag release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email ${{ github.actor }}
          git config user.name ${{ github.actor }}
          git tag -a "v${{ needs.read-release-version.outputs.release-version }}" \
            -m "Release v${{ needs.read-release-version.outputs.release-version }}"
          git push origin "v${{ needs.read-release-version.outputs.release-version }}"
