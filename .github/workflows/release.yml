name: Create ProtoDUNE-CDB Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish-target:
        description: "PyPI target for manual runs (push-publishing is skipped without PYPI_API_TOKEN — institutionally blocked; the Pages /simple/ index is the primary channel)"
        type: choice
        options: [pypi, testpypi, none]
        default: testpypi

permissions:
  contents: write
  packages: write

jobs:
  release-gates:
    # secrets context is unavailable in job-level if; surface presence as outputs.
    runs-on: ubuntu-latest
    outputs:
      pypi-token-set: ${{ steps.probe.outputs.pypi }}
    steps:
      - name: Probe publish secrets
        id: probe
        env:
          PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI" ]; then echo "pypi=true" >> "$GITHUB_OUTPUT"; else echo "pypi=false" >> "$GITHUB_OUTPUT"; fi

  read-release-version:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release-version.outputs.release_version }}
      should-publish: ${{ steps.publish-gate.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: VERSION

      - name: Read VERSION file
        id: release-version
        run: echo "release_version=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Publish-only-on-version-change (#44): a push to main cuts a GitHub
      # Release only when VERSION names an UNPUBLISHED version. A plain merge
      # over an already-released VERSION would --clobber the wheel assets and
      # silently rotate the #sha256 digests the /simple/ index pins, breaking
      # locked consumers (published-version immutability). workflow_dispatch
      # stays the explicit re-publish/repair override (design D1-D3). A hard
      # gh/API error aborts rather than guessing a direction.
      - name: Compute publish gate
        id: publish-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: v${{ steps.release-version.outputs.release_version }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != 'push' ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"   # manual run = deliberate publish
            exit 0
          fi
          out=$(gh release view "$RELEASE_TAG" --repo="$GITHUB_REPOSITORY" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"  # already published -> protect digests
          elif printf '%s' "$out" | grep -qiE 'not found|was not found|does not exist|could not be found|404'; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"   # unpublished version -> proceed to cut
          else
            echo "ERROR: indeterminate release state for $RELEASE_TAG (gh exit $rc):" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi

  build-and-upload-client-artifacts:
    needs: read-release-version
    uses: ./.github/workflows/client.yml
    with:
      release-version: "${{ needs.read-release-version.outputs.release-version }}"
    secrets: inherit

  build-and-upload-server-artifacts:
    # Restricted to main/manual runs: branch validation pushes must not
    # repush :latest images to GHCR from unmerged code.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: read-release-version
    uses: ./.github/workflows/server.yml
    with:
      release-version: "${{ needs.read-release-version.outputs.release-version }}"
    secrets: inherit

  publish-python-packages:
    # DORMANT channel, kept green-skippable on purpose: institutional
    # constraints block publishing to pypi.org (possibly permanently), so
    # PYPI_API_TOKEN is intentionally absent and push runs skip this job.
    # The GitHub Pages /simple/ index (deployed by pages.yml) is the
    # primary distribution channel. If that stance ever changes, adding the
    # PYPI_API_TOKEN repo secret activates this job unchanged; TestPyPI
    # dry-runs use TESTPYPI_API_TOKEN (tokens scoped to the three
    # pd-cds-* distributions).
    if: >-
      (github.event_name == 'push' && needs.release-gates.outputs.pypi-token-set == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish-target != 'none')
    needs:
      - read-release-version
      - release-gates
      - build-and-upload-client-artifacts
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi') && 'testpypi' || 'pypi' }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download all wheel artifacts (unpacked)
        uses: actions/download-artifact@v8
        with:
          pattern: pd-cds-wheels-*
          path: wheels/
          merge-multiple: true

      - name: Publish to PyPI (${{ (github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi') && 'TestPyPI' || 'PyPI' }})
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi')
                && secrets.TESTPYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
          TWINE_REPOSITORY_URL: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi')
                && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        run: |
          python -m pip install --upgrade pip twine
          twine check wheels/*
          twine upload --non-interactive --verbose wheels/*

  release:
    # GitHub Release creation restricted to main/manual runs so branch
    # validation pushes exercise the build chain without publishing tags.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs:
      - read-release-version
      - build-and-upload-client-artifacts
      - build-and-upload-server-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download client artifacts (frontier runtimes + wheel bundles, as zips)
        if: needs.read-release-version.outputs.should-publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: frontier-runtime_*
          path: dist/
          skip-decompress: true

      - name: Download wheel artifacts (as zips)
        if: needs.read-release-version.outputs.should-publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: pd-cds-wheels-*
          path: dist/
          skip-decompress: true

      - name: Download server artifacts
        if: needs.read-release-version.outputs.should-publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: "quadlet-artifacts-v${{ needs.read-release-version.outputs.release-version }}"
          path: dist/
          skip-decompress: true

      # Unpacked wheels+sdists as *individual* release assets (design D4):
      # direct pin-able URLs and the inputs the PEP 503 index enumerates.
      # Cross-arch sdists share filenames; merge-multiple keeps one copy.
      - name: Download wheel artifacts (unpacked)
        if: needs.read-release-version.outputs.should-publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: pd-cds-wheels-*
          path: dist-wheels/
          merge-multiple: true

      - name: Create release
        if: needs.read-release-version.outputs.should-publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: "v${{ needs.read-release-version.outputs.release-version }}"
        run: |
          if gh release view "$RELEASE_TAG" --repo="$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refreshing assets (--clobber)."
            gh release upload "$RELEASE_TAG" ./dist/*.zip \
              --clobber --repo="$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              ./dist/*.zip \
              --repo="$GITHUB_REPOSITORY" \
              --target="${{ github.ref_name }}" \
              --title="$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Attach unpacked wheels and sdists
        if: needs.read-release-version.outputs.should-publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: "v${{ needs.read-release-version.outputs.release-version }}"
        run: |
          ls dist-wheels/
          gh release upload "$RELEASE_TAG" dist-wheels/*.whl dist-wheels/*.tar.gz \
            --clobber --repo="$GITHUB_REPOSITORY"

      # No-op when publishing. On the VERSION-unchanged push path this is the
      # only step that runs, so the green 'release' job explains itself instead
      # of silently doing nothing (design D1). Skipped steps are not failures,
      # so release.yml still concludes success and pages.yml's workflow_run
      # deploy + smoke still fire - a correct idempotent self-heal (design D4).
      - name: Publish-gate skip summary
        if: needs.read-release-version.outputs.should-publish != 'true'
        env:
          RELEASE_TAG: v${{ needs.read-release-version.outputs.release-version }}
        run: |
          {
            echo "## Release skipped — \`$RELEASE_TAG\` already published"
            echo ""
            echo "\`VERSION\` is unchanged from the latest GitHub Release, so the create/upload"
            echo "steps were skipped. This protects **published-version immutability**: a"
            echo "re-upload would rebuild the wheels with new \`#sha256\` digests and silently"
            echo "rotate the assets the \`/simple/\` index pins, breaking locked consumers."
            echo ""
            echo "Merge to \`main\` publishes only on a \`VERSION\` bump. To deliberately"
            echo "re-publish or repair \`$RELEASE_TAG\`, run workflow_dispatch on \`release.yml\`"
            echo "(it keeps the explicit create-or-\`--clobber\` override):"
            echo ""
            echo '```'
            echo "gh workflow run release.yml --ref main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
