name: Release

on:
  push:
    # branches:
    #   - main
    # tags:
    #   - "v*" # Trigger on tags like v0.1.0, v2.2.3, etc.

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push-images:
    uses: ./.github/workflows/containers-ci.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Archive Quadlet artifacts & systemd unit files
        uses: actions/upload-artifact@v7
        with:
          name: quadlet-artifacts
          path: ./infra/containers/
