# Zensical project configuration — https://zensical.org/docs/setup/basics/
# Docs site deploys at the Pages root; /simple/** belongs to the wheel index
# (see openspec/changes/adopt-python-docs-tooling/design.md D3/D4).

[project]
site_name = "ProtoDUNE Conditions Data Service"
site_url = "https://dune.github.io/frontier-condb2/"
site_description = "Client, server infrastructure, and perf tests for the ProtoDUNE run-conditions database, served through the Frontier stack and a ConDB2 REST backend."
site_author = "Mike Clymer"
repo_url = "https://github.com/DUNE/frontier-condb2"
repo_name = "DUNE/frontier-condb2"
edit_uri = "edit/main/docs/"

watch = ["client/pd-cds-api/src", "client/pd-cds-cli/src"]

nav = [
  { Home = "index.md" },
  { Installation = "installation.md" },
  { "CLI guide" = "cli.md" },
  { "API Reference" = [
      "reference/pd_cds_api.md",
      "reference/pd_cds_api.bin.md",
      "reference/pd_cds_api.conditions.md",
      "reference/pd_cds_api.state.md",
      "reference/pd_cds_api.wrapper.md",
      "reference/pd_cds_cli.md",
      "reference/pd_cds_cli.main.md",
      "reference/pd_cds_cli.output.md",
  ] },
  { "Performance testing" = "perf.md" },
  { "Infrastructure runbook" = "infra/runbook.md" },
  { "Releases & maintenance" = "releases.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# API reference: native mkdocstrings rewrite; handler imports the workspace
# packages installed by `uv sync` (paths make src/ layouts resolvable).
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["client/pd-cds-api/src", "client/pd-cds-cli/src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
heading_level = 2
show_root_heading = true
show_source = false

# No api-autonav/autoapi: Zensical 0.0.69's native mkdocstrings does not
# cascade `members` into classes rendered via a module directive, so pydantic
# Field(description=…) metadata would be lost. scripts/gen_api_reference.py
# emits the committed docs/reference/ pages (class-granularity directives);
# CI checks drift with `python3 scripts/gen_api_reference.py --check`.
